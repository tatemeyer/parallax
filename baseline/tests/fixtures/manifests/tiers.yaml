# NOT any project's manifest. This encodes the platform spec's
# projection table — the three tiers TTUI's git-github-standards.md
# defines — so the autonomy vocabulary keeps end-to-end coverage now
# that the real manifests live in the projects they describe.
#
# TTUI's own parallax.yaml deliberately declares no autonomy_map: the
# tiers are assigned from a plan's Slice/Task tags, not from issue
# labels, and `label:direct` matches zero items there (Parallax #16).
apiVersion: parallax/v1
project:
  name: tiers
  root: <projects-root>/TTUI
  language: rust
  methodology: methodology-first     # informational only
work:
  adapter: github
  repo: tatemeyer/ttui
  autonomy_map:
    direct: { implement: agent, merge: direct-push }
    gated:  { implement: agent, merge: on-checks }
    human:  { implement: agent, merge: human-approval }
verification:
  - kind: lint
    adapter: command
    command: cargo clippy --all-targets -- -D warnings
  - kind: tests
    adapter: command
    command: cargo test
  - kind: perceptual
    adapter: plumb
    config: .plumb/config.yaml
artifacts:
  - kind: capture
    watch: .plumb/runs/**
sessions:
  watch: .claude/worktrees/*
