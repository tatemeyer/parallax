# .plumb/config.yaml — what Parallax captures, and what each capture is for.
#
# The cockpit is a TUI built with TTUI, so it is exactly the artifact
# Plumb exists to judge. The system verifying its own interface with its
# own perceptual tier is the strongest available demonstration that the
# tier is real.
scenarios:
  - name: cockpit-work
    adapter: pty
    args: target/debug/panopticon.exe --fixtures panopticon/fixtures
    size: 120x30
    script: .plumb/scripts/cockpit-work.json
    intent: >
      The Parallax cockpit, showing recorded state with a frozen clock,
      across two machines.
      A project rail on the left lists three rows, each with a health
      glyph: `sesh` and `ttui` read from this machine, and a third from a
      recorded peer. The peer's row is qualified with the machine it is
      on — `ttui@tates...`, ending in an ellipsis because the rail is
      narrower than the whole name — and that suffix is the only thing
      distinguishing it from the local `ttui` directly above it, which is
      the entire reason it is there. In the first frame, before the peer
      has answered, that row instead carries the machine's own name and a
      pending glyph rather than an ok one: a machine nobody has heard
      from has reported nothing, and nothing is not good news.
      The centre pane shows ttui's work in flight: issue and pull
      request numbers, their state, three autonomy columns, check counts,
      and titles. All three autonomy columns read as an em dash on every
      row, because TTUI's tiers claim an implement and a merge policy and
      say nothing about readiness — that is correct, not a rendering
      failure. A title too long for the pane ends in `...`; one that fits
      is shown whole. A footer across the bottom lists each source and
      how current it is, and when it raises a blocker it names which
      project the blocker belongs to. The final frame differs from the
      one before it: the selection has moved down one row.
    touches:
      - panopticon/src/**

  - name: cockpit-confirm
    adapter: pty
    args: target/debug/panopticon.exe --fixtures panopticon/fixtures
    size: 120x30
    script: .plumb/scripts/cockpit-confirm.json
    intent: >
      The cockpit being asked to confirm an irreversible action. The
      operator moves to a pull request row and presses `m`. The final
      frame differs from every earlier one in exactly one way that
      matters: the footer, which has been listing source ages, is now
      titled CONFIRM and holds a question naming the pull request by
      number and asking for that number to be typed. Nothing else moves,
      no window opens over the screen, and the work list stays fully
      readable behind the question -- an operator being asked something
      must still be able to see what they are being asked about.
    touches:
      - panopticon/src/control/**
      - panopticon/src/view/render.rs

  - name: cockpit-findings
    adapter: pty
    args: target/debug/panopticon.exe --fixtures panopticon/fixtures
    size: 120x30
    script: .plumb/scripts/cockpit-findings.json
    intent: >
      The artifacts pane showing a Plumb run and, indented beneath it,
      every finding that run produced -- one row each, carrying the
      severity, the lens that raised it, and the one-line claim. The
      operator moves onto the first finding, which is what `u` and `o`
      rule on. A run row and a finding row are visibly different things:
      the run names itself and its verdict word, a finding is indented
      and names no file. Long claims end in `...` rather than at the
      border.
    touches:
      - panopticon/src/view/artifacts.rs
