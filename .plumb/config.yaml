# .plumb/config.yaml — what Parallax captures, and what each capture is for.
#
# The cockpit is a TUI built with TTUI, so it is exactly the artifact
# Plumb exists to judge. The system verifying its own interface with its
# own perceptual tier is the strongest available demonstration that the
# tier is real.
scenarios:
  - name: cockpit-work
    adapter: pty
    args: target/debug/panopticon.exe --fixtures panopticon/fixtures
    size: 120x30
    script: .plumb/scripts/cockpit-work.json
    intent: >
      The Parallax cockpit, showing recorded state with a frozen clock,
      across three machines.
      A project rail on the left lists four rows, each with a health
      glyph: `sesh` and `ttui` read from this machine, and two more from
      recorded peers. Each peer's row is qualified with the machine it is
      on — `sesh@pi5`, and `ttui@tates...` ending in an ellipsis because
      the rail is narrower than the whole name. That suffix is the only
      thing distinguishing the last row from the local `ttui` two rows
      above it, which is the entire reason it is there. In the first
      frame, before either peer has answered, those rows instead carry
      the machines' own bare names and a pending glyph rather than an ok
      one: a machine nobody has heard from has reported nothing, and
      nothing is not good news.
      The centre pane shows ttui's work in flight: issue and pull
      request numbers, their state, three autonomy columns, check counts,
      and titles. All three autonomy columns read as an em dash on every
      row, because TTUI's tiers claim an implement and a merge policy and
      say nothing about readiness — that is correct, not a rendering
      failure. A title too long for the pane ends in `...`; one that fits
      is shown whole. A footer across the bottom lists each source and
      how current it is, and when it raises a blocker it names which
      project the blocker belongs to. The final frame differs from the
      one before it: the selection has moved down one row.
    touches:
      - panopticon/src/**

  - name: cockpit-peer
    adapter: pty
    args: target/debug/panopticon.exe --fixtures panopticon/fixtures
    size: 120x30
    script: .plumb/scripts/cockpit-peer.json
    intent: >
      The cockpit refusing to act on a machine it can only watch — and
      the point of this scenario is that it is one of *two* recorded
      machines, only one of which may be acted on. The operator moves
      the selection three times, past a peer that does accept actions,
      landing on the last row: the one on `tates-laptop`. They press
      `c`, which on any local row runs that project's build checks. Then
      `5`, which shows what this session has done.
      The final frame's detail pane holds exactly one entry, and it is a
      refusal rather than a result: it names the machine the row lives on
      and says this cockpit cannot act there, because the probe on that
      machine was started without the flag that would let it. Nothing
      asks for confirmation at any point, because there is nothing to
      confirm — the action was never offered, and being told after
      typing a confirmation would be worse than being told before it.
      The refusal must name `tates-laptop` specifically. A cockpit that
      refused every remote row would pass a weaker version of this test
      and be wrong: control is decided per machine, by that machine.
      The rail is unchanged
      throughout and no other project's row reacts, which is the whole
      point: the same keypress once ran a build against the local project
      that happened to share the remote one's name.
      Two things elsewhere on those frames carry the same idea. The work
      pane on the peer's row reads `not declared`, even though the local
      project of the same name has a full list of issues and pull
      requests — a peer is described by what it sent, never by a manifest
      on this machine. And the footer ages the peer's sources in seconds
      where a local project's read `live`: a value fetched from another
      machine can be recent, but it can never be live, and the screen has
      to be able to say the difference.
    touches:
      - panopticon/src/app.rs
      - panopticon/src/keys.rs
      - panopticon/src/control/**

  - name: cockpit-confirm
    adapter: pty
    args: target/debug/panopticon.exe --fixtures panopticon/fixtures
    size: 120x30
    script: .plumb/scripts/cockpit-confirm.json
    intent: >
      The cockpit being asked to confirm an irreversible action. The
      operator moves to a pull request row and presses `m`. The final
      frame differs from every earlier one in exactly one way that
      matters: the footer, which has been listing source ages, is now
      titled CONFIRM and holds a question naming the pull request by
      number and asking for that number to be typed. Nothing else moves,
      no window opens over the screen, and the work list stays fully
      readable behind the question -- an operator being asked something
      must still be able to see what they are being asked about.
    touches:
      - panopticon/src/control/**
      - panopticon/src/view/render.rs

  - name: cockpit-remote-confirm
    adapter: pty
    args: target/debug/panopticon.exe --fixtures panopticon/fixtures
    size: 120x30
    script: .plumb/scripts/cockpit-remote-confirm.json
    intent: >
      The cockpit asking to confirm an action that would run on a
      different machine. The operator moves the selection twice, landing
      on a row whose name carries an `@machine` suffix, and presses `m`.
      The final frame's footer is titled CONFIRM and holds a question
      that differs from the local confirmation in exactly one way that
      matters: it names the machine. The question says which pull
      request, and it says where — an operator one keystroke away from a
      different machine's row must not be able to read this question and
      think it is about the one in front of them. The pull request
      number is still what has to be typed, because a keystroke is a
      thing a hand does by reflex and a number is not.
      Nothing else moves. The rail still shows every machine, the work
      list stays readable behind the question, and no row anywhere shows
      a result yet — nothing has been sent, and a screen that implied
      otherwise would be claiming something about another machine that
      is not true.
    touches:
      - panopticon/src/control/**
      - panopticon/src/courier.rs
      - panopticon/src/view/render.rs

  - name: cockpit-unknown
    adapter: pty
    args: target/debug/panopticon.exe --fixtures panopticon/fixtures
    size: 120x30
    script: .plumb/scripts/cockpit-unknown.json
    intent: >
      The one thing a cockpit that acts across machines must be able to
      say: **I do not know what happened.** The operator confirms a merge
      on a remote row by typing the pull request number, and then presses
      `5` to see what this session has done.
      The final frame's detail pane holds one entry, and it is neither a
      success nor a failure. Its mark is distinct from both — the screen
      elsewhere uses `ok` for done and something clearly negative for
      failed, and this is neither. The line names the machine, quotes the
      action, and says the machine's answer could not be read.
      This is the distinction the whole remote-control arc rests on, so
      the frame is judged on whether an operator could confuse it with a
      failure. A failure means nothing happened and retrying is safe. An
      unknown means the merge may well have gone through and nobody can
      say — and an operator who reads one as the other retries something
      that already happened. If the entry reads as an error, that is a
      NO-GO however tidy the layout is.
    touches:
      - panopticon/src/control/**
      - panopticon/src/courier.rs

  - name: cockpit-findings
    adapter: pty
    args: target/debug/panopticon.exe --fixtures panopticon/fixtures
    size: 120x30
    script: .plumb/scripts/cockpit-findings.json
    intent: >
      The artifacts pane showing a Plumb run and, indented beneath it,
      every finding that run produced -- one row each, carrying the
      severity, the lens that raised it, and the one-line claim. The
      operator moves onto the first finding, which is what `u` and `o`
      rule on. A run row and a finding row are visibly different things:
      the run names itself and its verdict word, a finding is indented
      and names no file. Long claims end in `...` rather than at the
      border.
    touches:
      - panopticon/src/view/artifacts.rs
