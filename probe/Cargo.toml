[package]
name = "parallax-probe"
version = "0.1.0"
edition = "2021"
description = "Serves one machine's Parallax platform state. Binds loopback only; published to the tailnet by `tailscale serve`. Headless: never touches a terminal."

[dependencies]
parallax-baseline = { path = "../baseline" }
tiny_http = "0.12"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
