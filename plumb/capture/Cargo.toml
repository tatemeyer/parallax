[package]
name = "parallax-plumb"
version = "0.1.0"
edition = "2021"
description = "Capture adapters, blinded prompt construction, and verdict merging for the Plumb visual reviewer."

[[bin]]
name = "plumb"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
globset = "0.4"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = "0.25"
vt100 = "0.15"
font8x8 = "0.3"
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"
crossterm = "0.27"

[[example]]
name = "echo_key"
