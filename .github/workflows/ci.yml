# .github/workflows/ci.yml
#
# This repository is public, so Actions minutes are free. The shape
# below was originally chosen to cut a bill; it is kept because each
# part still earns its place without that argument:
#
#   * `clippy` and `fmt` run on Linux only. Neither is
#     platform-dependent: the lints and the formatter produce identical
#     results on both, so a second copy would add a wait rather than an
#     answer.
#   * `build` and `test` stay on both. This project is Windows-first and
#     its adapters shell out, spawn pseudo-consoles, and walk paths —
#     exactly the things that differ, and the reason a Windows-only bug
#     would otherwise reach a machine before CI did.
#   * `concurrency` cancels a superseded run when a branch is pushed
#     again, so the answer on screen belongs to the commit being read.
#   * Documentation-only changes skip CI, because there is no code to
#     build. **The consequence is worth knowing:** a docs-only pull
#     request gets no checks at all, so a branch protection rule that
#     required them would wait on one forever.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --verbose

  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --verbose

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
