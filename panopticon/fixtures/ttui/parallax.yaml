# How TTUI joins the Parallax platform.
#
# Read by `parallax-baseline`, which aggregates every registered
# project's work, verification, artifacts, and agent sessions into one
# view. See github.com/tatemeyer/parallax.
#
# `root:` is deliberately absent: the registry knows where this clone
# actually is, and a checked-in absolute path would be wrong on every
# machine but one.
apiVersion: parallax/v1
project:
  name: ttui
  language: rust
  methodology: methodology-first     # informational only; nothing branches on it
work:
  adapter: github
  repo: tatemeyer/ttui
  # No autonomy_map. TTUI's Direct/Gated/Human tiers are real, but they
  # are assigned from a plan's Slice/Task tags in
  # `.claude/rules/git-github-standards.md`, not from issue labels —
  # `label:direct` matches zero items in this repository. Declaring a
  # map of labels nothing carries would make every row project to "no
  # claim", which reads as a broken projection rather than as an honest
  # "this project does not label its work that way".
verification:
  - kind: lint
    adapter: command
    command: cargo clippy --all-targets -- -D warnings
  - kind: tests
    adapter: command
    command: cargo test
  - kind: perceptual
    adapter: plumb
    config: .plumb/config.yaml
artifacts:
  - kind: capture
    watch: .plumb/runs/**
sessions:
  watch: .claude/worktrees/*
