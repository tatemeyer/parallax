[package]
name = "parallax-panopticon"
version = "0.1.0"
edition = "2021"
description = "The Parallax cockpit: a read-only TUI over parallax-baseline."

[lib]
name = "panopticon"
path = "src/lib.rs"

[[bin]]
name = "panopticon"
path = "src/main.rs"

[dependencies]
ttui = "1"
# The event type TTUI's App trait takes; same version ttui uses.
crossterm = "0.27"
parallax-baseline = { path = "../baseline" }

[dev-dependencies]
tempfile = "3"
